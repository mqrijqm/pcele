<title>Pcela slijece na kosnice</title>

/*
 * Pcela slijece na kosnice — 1440x1024, pet sekundi.
 *
 * Crtez je slika, sve ostalo je nacrtano po njoj u jednoj boji. Redoslijed je
 * uvijek isti: slika, pa kosnice, pa pcela na vrhu.
 *
 * Sve tri stvari dijele isto njihanje. Da se njise samo slika, kosnice bi
 * stajale ukopane u polju koje se pomjera ispod njih, a to je jedino sto bi se
 * na kraju vidjelo — pomak je svega poldrug piksela.
 */
const W = 1440, H = 1024;
const BROWN = '#8B6F47';
const PAPER = '#F7EAD8';

const DUR = 5;          // sekundi animacije
const HOLD = 1.5;       // koliko zavrsni kadar stoji prije nego krene ispocetka
const HIVES_AT = 4;     // kad kosnice pocnu da se pojavljuju
const HIVES_FADE = 1;

/* Njihanje: pola herca, znaci pun krug za dvije sekunde. Sinus je vec
 * ease-in-out — najsporiji je na krajevima, gdje se smjer okrece. */
const SWAY_PX = 1.5;
const SWAY_HZ = 0.5;

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

/* Ekran je gust, platno je 1440x1024. Bez ovoga bi crtez bio ostar a sve
 * nacrtano preko njega mutno, jer se platno rasteze CSS-om. */
const dpr = Math.min(window.devicePixelRatio || 1, 2);
cv.width = W * dpr;
cv.height = H * dpr;
ctx.scale(dpr, dpr);

/* --- kosnice ------------------------------------------------------------- */
/*
 * Pet kosnica u redu, u prednjem planu. Sve stoje na istoj liniji tla i sve su
 * iste — detalj bi se ovdje tukao s crtezom iza njih, koji je i sam samo linija.
 */
const GROUND = 985;
const HIVE_W = 108, HIVE_H = 132, LID_H = 16, LID_OVER = 7;
const HIVES = [634, 782, 930, 1078, 1226].map((x) => ({ x }));
const CENTRE = HIVES[2];

function drawHive(cx, alpha) {
  const left = cx - HIVE_W / 2;
  const top = GROUND - HIVE_H;

  ctx.globalAlpha = alpha;
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = BROWN;

  // Tijelo: puno bojom papira, da crtez iza ne prosijava kroz kosnicu.
  ctx.fillStyle = PAPER;
  ctx.fillRect(left, top, HIVE_W, HIVE_H);
  ctx.strokeRect(left, top, HIVE_W, HIVE_H);

  // Jedna linija preko tijela — sanduk je iz dva dijela, i to je sav detalj.
  ctx.beginPath();
  ctx.moveTo(left, top + HIVE_H * 0.5);
  ctx.lineTo(left + HIVE_W, top + HIVE_H * 0.5);
  ctx.stroke();

  // Poklopac prelazi preko tijela s obje strane.
  ctx.fillStyle = BROWN;
  ctx.fillRect(left - LID_OVER, top - LID_H, HIVE_W + LID_OVER * 2, LID_H);

  // Leto.
  ctx.fillRect(cx - 19, GROUND - 18, 38, 7);

  ctx.globalAlpha = 1;
}

function drawBee(x, y, angle) {
  const s = BEE_SIZE / BEE_VB.w;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.scale(s, s);
  ctx.translate(-BEE_VB.x - BEE_VB.w / 2, -BEE_VB.y - BEE_VB.h / 2);
  ctx.fillStyle = BROWN;
  ctx.fill(BEE.wingBack, 'evenodd');
  ctx.fill(BEE.body, 'evenodd');
  ctx.fill(BEE.wingFront, 'evenodd');
  ctx.restore();
}

/* --- put ----------------------------------------------------------------- */
/*
 * Jedna kubna Bezierova kriva, od gore lijevo do poklopca srednje kosnice.
 * Kontrolne tacke su namjerno razvucene: prva gura pcelu uvis na pocetku,
 * druga je spusta pred sam doskok, pa let ima luk umjesto dijagonale.
 */
const P0 = { x: 250, y: 300 };
const P1 = { x: 560, y: 200 };
const P2 = { x: 700, y: 720 };
const P3 = { x: CENTRE.x, y: GROUND - HIVE_H - LID_H - 8 };

function bezier(p) {
  const u = 1 - p;
  const a = u * u * u, b = 3 * u * u * p, c = 3 * u * p * p, d = p * p * p;
  return {
    x: a * P0.x + b * P1.x + c * P2.x + d * P3.x,
    y: a * P0.y + b * P1.y + c * P2.y + d * P3.y,
  };
}

/* Nagib krive u tacki — po njemu se pcela okrece tamo gdje leti. */
function tangent(p) {
  const u = 1 - p;
  const a = 3 * u * u, b = 6 * u * p, c = 3 * p * p;
  return {
    x: a * (P1.x - P0.x) + b * (P2.x - P1.x) + c * (P3.x - P2.x),
    y: a * (P1.y - P0.y) + b * (P2.y - P1.y) + c * (P3.y - P2.y),
  };
}

const easeInOutCubic = (p) =>
  p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;

const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);

/* --- slika --------------------------------------------------------------- */
const img = new Image();
let fit = null;

/* --- kadar --------------------------------------------------------------- */
const still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let t0 = null;

function render(t) {
  const sway = Math.sin(2 * Math.PI * SWAY_HZ * t) * SWAY_PX;

  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(0, sway);

  ctx.drawImage(img, fit.x, fit.y, fit.w, fit.h);

  const hiveAlpha = clamp01((t - HIVES_AT) / HIVES_FADE);
  if (hiveAlpha > 0) for (const h of HIVES) drawHive(h.x, hiveAlpha);

  const p = easeInOutCubic(clamp01(t / DUR));
  const at = bezier(p);
  const dir = tangent(p);
  /*
   * Pri doskoku se pcela poravna: zadnjih petnaest posto puta nagib krive je
   * strm, pa bi inace sletjela nakrivo. Ugao se gasi, ne prekida.
   */
  const settle = clamp01((p - 0.85) / 0.15);
  const angle = Math.atan2(dir.y, dir.x) * (1 - settle);
  drawBee(at.x, at.y, angle);

  ctx.restore();
}

function frame(now) {
  if (t0 === null) t0 = now;

  /*
   * Kad prodje i animacija i pauza, sat se vraca na nulu — i vrijeme se poslije
   * toga mjeri ponovo. Da se ne izmjeri ponovo, jedan kadar bi se jos iscrtao
   * po starom vremenu, pa bi se na svakom krugu vidio trzaj.
   */
  if ((now - t0) / 1000 > DUR + HOLD) t0 = now;

  render(Math.min((now - t0) / 1000, DUR));
  requestAnimationFrame(frame);
}

/*
 * Slika se ceka prije prvog kadra. Zakacen je jedan jedini `onload`, i to prije
 * nego se postavi `src` — ako je slika u kesu, `load` plane odmah i drugi
 * rukovalac bi zakasnio.
 *
 * Ko je iskljucio animacije u sistemu ne dobija ni njihanje ni let, nego
 * zavrsni kadar: pcela vec sjedi na srednjoj kosnici.
 */
img.onload = () => {
  /*
   * Crtez je siri od platna, pa staje po sirini a ne po visini: nista se ne
   * odsijeca.
   *
   * Visak visine ide sav gore, ne pola gore pola dolje. Gornji rub crteza je
   * prazno nebo, pa se dopuna bojom papira tamo ne vidi; da je ista traka
   * dolje, stajala bi kao prazan pojas ispod trave. Ovako prednji plan sjeda
   * na donji rub platna, gdje kosnicama i jeste mjesto.
   */
  const s = Math.min(W / img.width, H / img.height);
  fit = { w: img.width * s, h: img.height * s };
  fit.x = (W - fit.w) / 2;
  fit.y = H - fit.h;

  if (still) render(DUR);
  else requestAnimationFrame(frame);
};

img.src = 'original-landscape.png';
